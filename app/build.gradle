plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.example.controledegastos'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.controledegastos"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "com.example.controledegastos.HiltTestRunner"
    }

    testOptions {
        animationsDisabled = true
        if (providers.gradleProperty('testOrchestrator').orNull == 'true') {
            execution "ANDROIDX_TEST_ORCHESTRATOR"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures{
        viewBinding = true
    }

}

kapt {
    arguments {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.3'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    //MPAndroidChart(gráficos interativos)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //dagger hilt
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    kaptAndroidTest 'com.google.dagger:hilt-android-compiler:2.60.1'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    kapt 'com.google.dagger:hilt-compiler:2.60.1'

    //Room Database
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'

    //testes
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    androidTestUtil 'androidx.test:orchestrator:1.6.1'

    //Espresso
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'


}
